<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oyuncu Arama & Profili | MitaNetwork</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <style>
        .player-search-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 140px 20px 60px 20px;
            text-align: center;
        }

        .search-box-wrapper {
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 85, 255, 0.2);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .search-title {
            font-size: 2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 15px;
        }

        .search-form {
            display: flex;
            gap: 10px;
            justify-content: center;
            max-width: 550px;
            margin: 0 auto;
        }

        .search-input {
            flex: 1;
            background: rgba(10, 10, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            padding: 12px 18px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-input:focus {
            border-color: #ff55ff;
            box-shadow: 0 0 12px rgba(255, 85, 255, 0.4);
        }

        .search-btn {
            background: #ff55ff;
            color: #000;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .search-btn:hover {
            background: #ff77ff;
            box-shadow: 0 0 15px rgba(255, 85, 255, 0.6);
        }

        /* Profile Result Card */
        .player-card {
            display: none;
            background: rgba(20, 20, 25, 0.85);
            border: 1px solid rgba(255, 85, 255, 0.3);
            border-radius: 16px;
            padding: 40px 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .player-avatar {
            width: 140px;
            height: auto;
            image-rendering: pixelated;
            filter: drop-shadow(0 0 15px rgba(255, 85, 255, 0.4));
            margin-bottom: 20px;
        }

        .player-name {
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }

        .player-uuid {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 6px 14px;
            border-radius: 20px;
            color: #aaa;
            font-size: 0.85rem;
            margin-bottom: 25px;
            font-family: monospace;
        }

        .stats-grid {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
            max-width: 600px;
        }

        .stat-card {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px 20px;
            border-radius: 10px;
            flex: 1;
            min-width: 140px;
        }

        .stat-card i {
            font-size: 1.5rem;
            color: #ff55ff;
            margin-bottom: 8px;
        }

        .stat-card div {
            color: #aaa;
            font-size: 0.8rem;
        }

        .stat-card span {
            color: #fff;
            font-weight: 700;
            font-size: 1.1rem;
        }

        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .social-links a {
            color: #ccc;
            font-size: 1.4rem;
            transition: color 0.3s ease, transform 0.3s ease;
        }

        .social-links a:hover {
            color: #ff55ff;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <a href="../" class="brand">
                <i class="fa-solid fa-cube glow-icon"></i> Mita<span>Network</span>
            </a>
            <ul class="nav-links">
                <li><a href="../">Ana Sayfa</a></li>
                <li><a href="../hakkımızda/">Hakkımızda</a></li>
                <li><a href="../kurallar/">Kurallar</a></li>
                <li><a href="../yetkililer/">Yetkililer</a></li>
                <li><a href="../başvuru/">Başvuru</a></li>
            </ul>
        </div>
    </nav>

    <div class="player-search-container">
        <div class="search-box-wrapper">
            <h1 class="search-title">Oyuncu Profili Ara</h1>
            <form class="search-form" onsubmit="searchPlayer(event)">
                <input type="text" id="usernameInput" class="search-input" placeholder="Minecraft kullanıcı adı girin..." required>
                <button type="submit" class="search-btn"><i class="fa-solid fa-magnifying-glass"></i> Ara</button>
            </form>
        </div>

        <div class="player-card" id="playerCard">
            <img id="playerSkin" src="" alt="Oyuncu Skin" class="player-avatar">
            <h2 class="player-name" id="playerName">-</h2>
            <div class="player-uuid" id="playerUUID">UUID: Yükleniyor...</div>

            <div class="stats-grid">
                <div class="stat-card">
                    <i class="fa-solid fa-shield-halved"></i>
                    <div>Sunucu Durumu</div>
                    <span id="playerStatus">Kayıtlı Oyuncu</span>
                </div>
                <div class="stat-card">
                    <i class="fa-solid fa-gamepad"></i>
                    <div>Oyun Modu</div>
                    <span>Anarşi</span>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 <span>MitaNetwork</span>. Tüm hakları saklıdır.</p>
        <div class="social-links">
            <a href="#" target="_blank" title="YouTube"><i class="fa-brands fa-youtube"></i></a>
            <a href="https://www.instagram.com/mita.itk2/" target="_blank" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://www.tiktok.com/@mita.itk2" target="_blank" title="TikTok"><i class="fa-brands fa-tiktok"></i></a>
        </div>
    </footer>

    <script>
        async function fetchPlayer(username) {
            const card = document.getElementById("playerCard");
            const skinImg = document.getElementById("playerSkin");
            const nameElem = document.getElementById("playerName");
            const uuidElem = document.getElementById("playerUUID");

            nameElem.innerText = username;
            skinImg.src = `https://visage.surgeplay.com/bust/160/${username}`;
            card.style.display = "flex";

            try {
                const res = await fetch(`https://api.mojang.com/users/profiles/minecraft/${username}`);
                if (res.ok) {
                    const data = await res.json();
                    uuidElem.innerText = `UUID: ${data.id}`;
                } else {
                    uuidElem.innerText = `Korsan / Özel Hesap`;
                }
            } catch (err) {
                uuidElem.innerText = `Korsan / Özel Hesap`;
            }
        }

        function searchPlayer(e) {
            e.preventDefault();
            const input = document.getElementById("usernameInput").value.trim();
            if (input) {
                window.history.pushState({}, "", `?isim=${input}`);
                fetchPlayer(input);
            }
        }

        window.addEventListener("DOMContentLoaded", () => {
            const urlParams = new URLSearchParams(window.location.search);
            const isim = urlParams.get("isim");
            if (isim) {
                document.getElementById("usernameInput").value = isim;
                fetchPlayer(isim);
            }
        });
    </script>
    <script src="../js/main.js"></script>
</body>
</html>
